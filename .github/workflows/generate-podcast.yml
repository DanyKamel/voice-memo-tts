name: Jack Hopkins Podcast Generator

on:
  workflow_dispatch:
    inputs:
      start_index:
        description: 'Start from video index (0 = most recent)'
        required: false
        default: '0'
      batch_size:
        description: 'Videos to process per run'
        required: false
        default: '15'

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    permissions:
      contents: write  # needed to push docs/ and create releases

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install yt-dlp edge-tts anthropic

      - name: Run podcast generator
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          BATCH_SIZE: ${{ github.event.inputs.batch_size }}
          START_INDEX: ${{ github.event.inputs.start_index }}
          PAGES_URL: https://danykamel.github.io/voice-memo-tts
        run: python3 scripts/process_channel.py

      - name: Commit updated RSS feed + index
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/
          git diff --staged --quiet || git commit -m "Podcast batch: index ${{ github.event.inputs.start_index }}, size ${{ github.event.inputs.batch_size }}"
          git push
